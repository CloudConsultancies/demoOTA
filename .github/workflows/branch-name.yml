name: Branch name

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern='^(issue/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*|chore/[a-z0-9]+(-[a-z0-9]+)*)$'
          if [[ "$BRANCH" =~ $pattern ]]; then
            echo "Branch '$BRANCH' follows the naming convention."
          else
            echo "::error::Branch '$BRANCH' does not match issue/N-short-name or chore/short-name (lowercase, digits, hyphens)."
            exit 1
          fi
