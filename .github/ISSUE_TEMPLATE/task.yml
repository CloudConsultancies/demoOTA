name: Task / improvement
description: A change to implement (feature, infrastructure, hardening, cleanup)
labels: [enhancement]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this needed? What is the current state?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable conditions for "done".
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Approach ideas, links, risks, cost impact, out of scope.
